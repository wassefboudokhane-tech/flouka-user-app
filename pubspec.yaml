name: flouka
description: Flouka year-1 — creator storefronts and brand shops. No Flouka cart.
publish_to: "none"
version: 3.0.0+30

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^6.4.0
  cupertino_icons: ^1.0.8
  firebase_analytics: ^11.6.0
  firebase_core: ^3.15.1
  flutter_dotenv: ^5.2.1
  go_router: ^16.2.4
  google_sign_in: ^7.2.0
  http: ^1.5.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  posthog_flutter: ^5.9.0
  provider: ^6.1.5
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.2
  clarity_flutter: ^1.4.1
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/demo/
    - assets/icons/
    - .env.example
  fonts:
    - family: MarkaziText
      fonts:
        - asset: assets/fonts/MarkaziText-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
